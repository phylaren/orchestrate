name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Build, tests and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Playwright Chromium with system dependencies
        run: ./gradlew installPlaywright

      - name: Run check (fast tests, then E2E tests)
        run: ./gradlew check

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 14

      - name: Upload E2E traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: build/e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14
