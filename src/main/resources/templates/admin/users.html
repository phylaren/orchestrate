<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head th:replace="~{fragments/layout :: head('Користувачі')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <h1>Користувачі</h1>

    <div class="table-wrap">
        <table class="table">
            <thead>
            <tr>
                <th>Ім’я</th>
                <th>Електронна пошта</th>
                <th>Роль</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.displayName}">Ім’я</td>
                <td th:text="${user.email}">user@example.com</td>
                <td>
                    <span th:if="${user.role.name() == 'ADMIN'}" class="badge badge-ok">Адміністратор</span>
                    <span th:unless="${user.role.name() == 'ADMIN'}" class="badge">Користувач</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
