# Профіль dev — локальна розробка.
# Ієрархія: значення за замовчуванням стартера -> application.properties -> application-dev.properties.

# Сповіщення пишемо в лог разом з усіма атрибутами, щоб бачити їх під час налагодження.
orchestrate.notification.enabled=true
orchestrate.notification.channel=log
orchestrate.notification.source=orchestrate-dev
orchestrate.notification.include-details=true

logging.level.genius.project.starter.notification=DEBUG
