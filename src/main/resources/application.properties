spring.application.name=orchestrate

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=false

spring.datasource.url=jdbc:h2:mem:orchestrate;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=access
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=%t %{X-Trace-Id}o %a "%r" %s %b %Dms

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persist-authorization=true
springdoc.default-produces-media-type=application/json

security.jwt.secret=${ORCHESTRATE_JWT_SECRET:dev-only-secret-key-min-32-bytes-do-not-use-in-prod}
security.jwt.expiration-minutes=15

# Статика: версіонування за хешем вмісту та річний кеш для хешованих файлів
spring.web.resources.chain.enabled=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.chain.cache=true
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# Шаблони Thymeleaf розбираються один раз; вимикати кеш можна лише локально
spring.thymeleaf.cache=true
