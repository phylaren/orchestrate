# Профіль prod — робоче середовище.
# Ієрархія: значення за замовчуванням стартера -> application.properties -> application-prod.properties
# -> змінні оточення (мають найвищий пріоритет).

# Сповіщення надсилаються на зовнішній webhook; URL обов'язковий, без нього застосунок не стартує.
orchestrate.notification.enabled=true
orchestrate.notification.channel=webhook
orchestrate.notification.webhook.url=${ORCHESTRATE_NOTIFICATION_WEBHOOK_URL:}
orchestrate.notification.webhook.timeout=3s
orchestrate.notification.source=orchestrate-prod
orchestrate.notification.include-details=false

# Без SQL у логах, H2-консолі та Swagger UI у prod.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
