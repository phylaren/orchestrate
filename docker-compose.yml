# Запуск: cp .env.example .env, заповнити значення, потім docker compose up -d --build.
services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ORCHESTRATE_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?}
      ORCHESTRATE_DB_USERNAME: ${POSTGRES_USER:?}
      ORCHESTRATE_DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      ORCHESTRATE_JWT_SECRET: ${ORCHESTRATE_JWT_SECRET:?}
      ORCHESTRATE_NOTIFICATION_WEBHOOK_URL: ${ORCHESTRATE_NOTIFICATION_WEBHOOK_URL:?}
      ORCHESTRATE_SECURITY_CORS_ALLOWED_ORIGINS: ${ORCHESTRATE_SECURITY_CORS_ALLOWED_ORIGINS:?}
      ORCHESTRATE_TRUSTED_PROXIES: ${ORCHESTRATE_TRUSTED_PROXIES:-172[.]28[.]0[.].*}
    networks:
      - orchestrate
    # Порт 8080 доступний лише всередині мережі compose і назовні не публікується.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Більше за spring.lifecycle.timeout-per-shutdown-phase=30s, щоб Docker не вбив JVM раніше.
    stop_grace_period: 40s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orchestrate

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/${NGINX_MODE:-tunnel}:/etc/nginx/templates:ro
      - ./deploy/nginx/docker-entrypoint.d/40-reload-on-renew.sh:/docker-entrypoint.d/40-reload-on-renew.sh:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - orchestrate

  certbot:
    image: certbot/certbot:latest
    profiles: ["tls"]
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet
          sleep 12h & wait $${!}
        done
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - orchestrate

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    command: tunnel --no-autoupdate --url http://nginx:80
    networks:
      - orchestrate

networks:
  orchestrate:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres-data:
  letsencrypt:
  certbot-www:
