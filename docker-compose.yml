# Запуск: cp .env.example .env, заповнити значення, потім docker compose up -d --build.
services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ORCHESTRATE_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?}
      ORCHESTRATE_DB_USERNAME: ${POSTGRES_USER:?}
      ORCHESTRATE_DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      ORCHESTRATE_JWT_SECRET: ${ORCHESTRATE_JWT_SECRET:?}
      ORCHESTRATE_NOTIFICATION_WEBHOOK_URL: ${ORCHESTRATE_NOTIFICATION_WEBHOOK_URL:?}
      ORCHESTRATE_SECURITY_CORS_ALLOWED_ORIGINS: ${ORCHESTRATE_SECURITY_CORS_ALLOWED_ORIGINS:?}
      ORCHESTRATE_TEST_ENDPOINTS_ENABLED: ${ORCHESTRATE_TEST_ENDPOINTS_ENABLED:-false}
    # Loopback only: permits local tools such as ngrok without exposing the app directly.
    ports:
      - "127.0.0.1:8080:8080"
    # Порт 8080 опублікований лише на loopback-інтерфейсі хоста.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Більше за spring.lifecycle.timeout-per-shutdown-phase=30s, щоб Docker не вбив JVM раніше.
    stop_grace_period: 40s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
